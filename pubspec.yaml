name: simple_reveal
description: >-
  Scroll reveal widgets for Flutter, in pure Dart with no dependencies. Blocks
  fade, slide, zoom, blur, turn or flip into place as they come into view, or
  with the scroll.
version: 0.1.3
homepage: https://packages.comapps.be/simple_reveal/
repository: https://github.com/raphrmx/simple_reveal
issue_tracker: https://github.com/raphrmx/simple_reveal/issues

screenshots:
  - description: Scroll reveal for Flutter, in pure Dart with no dependencies.
    path: screenshots/cover.webp
  - description: A landing page opening, its photo settling and its title coming in piece by piece.
    path: screenshots/page_opening.webp
  - description: A section coming in from either side of the page, its text from the left and its photo from the right.
    path: screenshots/sections.webp
  - description: A grid of cards coming in one after the other, in reading order.
    path: screenshots/grid.webp
  - description: A quote turning into place over a photo that eases back with the scroll.
    path: screenshots/quote.webp

topics:
  - animation
  - scrolling
  - reveal
  - transition
  - ui

environment:
  sdk: ^3.1.0
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
