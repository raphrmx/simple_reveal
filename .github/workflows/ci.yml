name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Catches SDK drift on a package that can go months without a commit: a new
  # formatter default or a new lint shows up here rather than on the next release.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]

    # The beta leg is an early warning, not a gate.
    continue-on-error: ${{ matrix.channel == 'beta' }}

    name: ${{ matrix.channel }}

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # Opens every screen of the example and scrolls it, with and without
      # reduced motion, so a demo that throws is caught before the live demo is.
      - name: Run the example's tests
        working-directory: example
        run: flutter test test

      # Fails on a packaging regression, such as a CHANGELOG that no longer
      # mentions the version in pubspec.yaml.
      #
      # The tree is restored first: `flutter pub get` rewrites generated files
      # that are checked in, and the dry-run also refuses a working tree that
      # differs from HEAD. That last check guards a human publishing from a
      # dirty directory, and means nothing on a fresh checkout.
      - name: Validate the package
        run: |
          git checkout -- .
          flutter pub publish --dry-run

  # The oldest Flutter the pubspec admits. The package cannot be developed on it
  # (its dev dependencies need a newer Dart), so its tests are run from a
  # throwaway app depending on it instead, which is what a user on that Flutter
  # would do. Catches an API the floor does not have, such as the `axis` of
  # `Scrollable.maybeOf`, which Flutter 3.10 lacks.
  floor:
    runs-on: ubuntu-latest

    name: floor (3.13.9)

    steps:
      - uses: actions/checkout@v4
        with:
          path: simple_reveal

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.13.9
          channel: stable

      - name: Build a consumer app
        run: |
          mkdir -p floor/test
          cat > floor/pubspec.yaml <<'YAML'
          name: floor
          publish_to: none
          environment:
            sdk: ^3.1.0
          dependencies:
            flutter:
              sdk: flutter
            simple_reveal:
              path: ../simple_reveal
          dev_dependencies:
            flutter_test:
              sdk: flutter
          YAML
          cp simple_reveal/test/*.dart floor/test/

      - name: Run the package tests on it
        working-directory: floor
        run: |
          flutter pub get
          flutter test
